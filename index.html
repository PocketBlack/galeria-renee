    .section-title {

      letter-spacing: 5px;
      text-transform: uppercase;
      color: #999;
      font-weight: 600;
      border-bottom: 1px solid #f0f0f0;
      margin-bottom: 4px;
    }

      scrollbar-width: none;
      justify-content: center; 
      width: 100%;
    }
    .horizontal-gallery::-webkit-scrollbar { display: none; }

      padding: 60px 8% 120px;
      background-color: var(--soft-gray);
    }
